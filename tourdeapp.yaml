exposedPort: 80
containers:
  - name: web
    image: registry.tourde.cloud/i_m_a_teapot/web
    port: 3001
    env:
      PORT: "3001"
      VITE_API_URL: "/api"
  - name: server
    image: registry.tourde.cloud/i_m_a_teapot/server
    port: 8080
    env:
      FLASK_DB_HOST: 127.0.0.1
      FLASK_DB_NAME: product
      FLASK_DB_PASSWORD: "{{MYSQL_PASSWORD}}"
      FLASK_DB_PORT: "3306"
      FLASK_DB_USER: tda_user
      PORT: "8080"
  - name: mysql
    image: mysql
    tag: "8.4"
    env:
      MYSQL_DATABASE: product
      MYSQL_ROOT_PASSWORD: "{{MYSQL_ROOT_PASSWORD}}"
      MYSQL_USER: tda_user
      MYSQL_PASSWORD: "{{MYSQL_PASSWORD}}"
    port: 3306
  - name: caddy
    image: registry.tourde.cloud/i_m_a_teapot/caddy
    port: 80
build:
  - name: web
    context: ./frontend
    dockerfile: ./frontend/Dockerfile
    args:
      VITE_API_URL: "/api"
  - name: server
    context: ./backend
    dockerfile: ./backend/docker/Dockerfile
  - name: caddy
    context: ./caddy
    dockerfile: ./caddy/Dockerfile
